<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DeepSec logo">
  <!-- DeepSec — security scan mark: shield + radar sweep + scan line -->
  <defs>
    <linearGradient id="ds-shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="ds-sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0a0f"/>
  <!-- shield -->
  <path d="M32 7 13 15.5v14.7c0 11.4 8 22.3 19 27.3 11-5 19-15.9 19-27.3V15.5L32 7z"
        fill="none" stroke="url(#ds-shield)" stroke-width="3.4" stroke-linejoin="round"/>
  <!-- radar sweep inside the shield -->
  <path d="M32 20a12.5 12.5 0 0 1 12.5 12.5H32V20z" fill="url(#ds-sweep)"/>
  <!-- scan line -->
  <path d="M22.5 39.5 32 32l12-12" fill="none" stroke="#10b981" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- detection blips -->
  <circle cx="26" cy="26" r="1.9" fill="#3b82f6"/>
  <circle cx="39" cy="39.5" r="1.9" fill="#3b82f6"/>
</svg>
