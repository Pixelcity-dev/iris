name: 'Iris Security Scan'
description: 'Run Iris security checks on a repository and write findings to a supported report format.'
author: 'Pixelcity'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  scan-type:
    description: 'Comma-separated scanners to run (sast, sca, secrets, iac, container, dast, webscan, network, license, format)'
    required: false
    default: 'sast,sca,secrets'
  severity:
    description: 'Minimum finding severity to include (info, low, medium, high, critical)'
    required: false
    default: 'low'
  format:
    description: 'Output format (sarif, json, table, html, csv; check iris scan --help for additional formats)'
    required: false
    default: 'sarif'
  output:
    description: 'Output file path'
    required: false
    default: 'iris-results.sarif'
  upload-code-scanning:
    description: 'Upload the SARIF report to GitHub Code Scanning (requires SARIF output and permissions)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Install Iris
      shell: bash
      run: |
        curl -fsSL https://cdn.pixelcity.dev/iris/install.sh | sh

    - name: Run Iris Scan
      shell: bash
      run: |
        iris scan . \
          --scanner ${{ inputs.scan-type }} \
          --severity ${{ inputs.severity }} \
          --format ${{ inputs.format }} \
          --output ${{ inputs.output }}

    - name: Upload SARIF to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.output }}
      if: inputs.upload-code-scanning == 'true' && always()
