name: Bug report
description: Something in Iris behaves incorrectly or crashes.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste real credentials, customer
        code, or production scan output. Redact before posting.
  - type: input
    id: version
    attributes:
      label: Iris version
      description: Output of `iris --version`
      placeholder: 1.2.0 (commit b57e78e)
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and architecture
      placeholder: Debian 13, amd64
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and flags
      description: The exact command that produced the problem.
      render: shell
      placeholder: iris scan . --scanner sast,secrets --severity high
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include the error text or a redacted excerpt of the output.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Smallest input that shows the problem. A synthetic fixture is ideal.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I am running the latest release, or `master` built from source.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
        - label: This report contains no live secrets or third-party data.
          required: true
